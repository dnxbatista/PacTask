services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: pactask-db
    environment:
      ACCEPT_EULA: "Y"
      SA_PASSWORD: ${SA_PASSWORD}
      MSSQL_PID: "Express"
    ports:
      - "1433:1433"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P $$SA_PASSWORD -C -Q 'SELECT 1' || /opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P $$SA_PASSWORD -C -Q 'SELECT 1'"
        ]
      interval: 10s
      timeout: 10s
      retries: 15

  api:
    build:
      context: ./PacTaskAPI
      dockerfile: Dockerfile
    container_name: pactask-api
    depends_on:
      db:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: "Server=db;Database=${DB_NAME};User Id=sa;Password=${SA_PASSWORD};TrustServerCertificate=True;"
      JWT__Issuer: ${JWT_ISSUER}
      JWT__Audience: ${JWT_AUDIENCE}
      JWT__SigningKey: ${JWT_SIGNING_KEY}
    ports:
      - "8080:8080"

  web:
    build:
      context: ./PacTaskWEB
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL}
    container_name: pactask-web
    depends_on:
      - api
    ports:
      - "5173:80"
